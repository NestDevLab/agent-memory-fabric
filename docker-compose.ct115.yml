services:
  agent-memory-fabric:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["node", "src/server.mjs"]
    restart: unless-stopped
    env_file:
      - .env.runtime
    volumes:
      - ./:/app
      # Production deployments should mount a secret file and set:
      # AMF_AUTH_REGISTRY_PATH=/run/secrets/agent-memory-fabric-auth.json
      # - /run/secrets/agent-memory-fabric-auth.json:/run/secrets/agent-memory-fabric-auth.json:ro
    ports:
      - "8787:8787"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
